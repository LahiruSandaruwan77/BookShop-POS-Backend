# ---------- Database: H2 in FILE mode (data survives restarts) ----------
# The database is a single file: ./data/posdb.mv.db next to the jar.
spring.datasource.url=jdbc:h2:file:./data/posdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Dev convenience: Hibernate creates/updates tables from the entities.
# Before going live, switch to 'validate' and manage schema changes deliberately.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# H2 web console at http://localhost:8080/h2-console (dev only!)
spring.h2.console.enabled=true

server.port=8080

# Expose exception messages (e.g. "Barcode already used by ...") in the JSON
# error body — the React frontend surfaces these directly to the user.
# Default is 'never', which would otherwise hide every validation message.
server.error.include-message=always
server.error.include-binding-errors=always

# ---------- Scheduled database backups (see BackupService) ----------
# Folder the .zip snapshots are written to — point this at a synced OneDrive/
# Google Drive folder for an off-machine copy, no code change needed.
pos.backup.dir=./backups
# Cron: second minute hour day-of-month month day-of-week. Default: 9:00 PM daily.
pos.backup.cron=0 0 21 * * *
# How many of this app's own backup files to keep; older ones are deleted.
pos.backup.keep=14
